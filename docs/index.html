<!doctype html>

<meta charset="utf-8">

<title>Graphic Enhancement</title>

<link rel="icon" href="icon.png">
<style>
:root{--bg:#0f0b1a;--panel:#1a1430;--text:#f1edf9;--muted:#b6add0;--line:#2e2550;--accent:#ec6aa0;--accent2:#9a6bd8;--warm:#f7a07c}
@media (prefers-color-scheme: light){:root{--bg:#faf8fd;--panel:#ffffff;--text:#1d1730;--muted:#5d5576;--line:#e3dcef;--accent:#c93d7d;--accent2:#7a4cc0;--warm:#d8693f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand img{width:32px;height:32px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;max-width:180px}
.hero{text-align:center;padding:40px 0 24px}
.hero img{width:120px;height:120px}
h1{font-size:clamp(32px,6vw,52px);line-height:1.1;margin:16px 0 8px;background:linear-gradient(180deg,var(--accent2),var(--accent) 55%,var(--warm));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:clamp(17px,2.4vw,21px);margin:0 0 6px}
.chips{color:var(--muted);margin:0 0 20px}
.intro{max-width:680px;margin:0 auto 24px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{display:inline-block;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:600}
a.primary{background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff}
a.ghost{border:1px solid var(--line);color:var(--text)}
.note{max-width:680px;margin:14px auto 0;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:32px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
.box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warm);border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px}
footer{color:var(--muted);font-size:14px;padding:24px 0 40px;border-top:1px solid var(--line);margin-top:24px}
footer a{color:var(--accent)}
</style>
</head>

// Browser language decides (e.g. en-US -> English, tr-TR -> Türkçe); ?lang= and the menu override it.
function pick(tag) {
  if (!tag) return null;
  const t = tag.toLowerCase();
  if (t.startsWith("zh")) return /(tw|hk|mo|hant)/.test(t) ? "zh-TW" : "zh-CN";
  if (t.startsWith("pt")) return "pt-BR";
  const base = t.split("-")[0];
  return T[base] ? base : null;
}
function detect() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && (T[q] || pick(q))) return T[q] ? q : pick(q);
  try { const saved = localStorage.getItem("ge-lang"); if (saved && T[saved]) return saved; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language])) { const p = pick(l); if (p) return p; }
  return "en";
}
function apply(code) {
  const d = T[code];
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i]").forEach(el => { const k = el.dataset.i; if (d[k]) el.textContent = d[k]; });
  document.title = "Graphic Enhancement · " + d.tagline;
  sel.value = code;
}
const sel = document.getElementById("lang");
for (const [code, d] of Object.entries(T)) sel.add(new Option(d.name, code));
sel.addEventListener("change", () => { try { localStorage.setItem("ge-lang", sel.value); } catch (e) {} apply(sel.value); });
apply(detect());
</script>
